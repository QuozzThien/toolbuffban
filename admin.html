<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Display config editor</title><style>body{font:16px system-ui;max-width:540px;margin:30px auto;padding:16px;background:#101713;color:#e7f8ed}label,input,textarea,button{display:block;margin:10px 0}input,textarea{width:95%;padding:8px}button{padding:10px}</style><h1>Display config editor</h1><p>Chỉnh cấu hình, sao chép JSON rồi lưu vào config.json bằng tài khoản GitHub có quyền ghi. Trang này không cấp quyền ghi.</p><label>Tiêu đề<input id="title" value="VIP TOOL"></label><label>Phiên bản<input id="version" value="V4.9"></label><label>Thông báo<input id="notice" value="SYSTEM ONLINE"></label><label>Màu<input id="color" type="color" value="#00ff9c"></label><label>Hiện giao diện<input id="enabled" type="checkbox" checked></label><button id="make">Tạo JSON</button><textarea id="out" rows="10" readonly></textarea><button id="copy">Copy JSON</button><script>const el=id=>document.getElementById(id);el('make').onclick=()=>el('out').value=JSON.stringify({title:el('title').value,version:el('version').value,notice:el('notice').value,color:el('color').value,enabled:el('enabled').checked},null,2);el('copy').onclick=async()=>{el('make').click();try{await navigator.clipboard.writeText(el('out').value)}catch(e){el('out').select()}};el('make').click();</script></html>
